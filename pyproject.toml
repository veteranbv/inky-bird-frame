[project]
name = "inky-bird-frame"
version = "0.6.0"
description = "Discover birds and display reviewed field-journal plates on color e-paper"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Henry Sowell" }]
keywords = [
    "birding",
    "birdnet",
    "ebird",
    "e-paper",
    "inaturalist",
    "raspberry-pi",
    "self-hosted",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://henrysowell.com/birds"
Documentation = "https://github.com/veteranbv/inky-bird-frame#readme"
Issues = "https://github.com/veteranbv/inky-bird-frame/issues"
Releases = "https://github.com/veteranbv/inky-bird-frame/releases"
Repository = "https://github.com/veteranbv/inky-bird-frame"

[project.optional-dependencies]
controller = [
    "apprise>=1.12.0,<2",
]
inky = [
    "inky>=2.4",
]
dev = [
    "apprise>=1.12.0,<2",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
inky-bird-frame = "inky_bird_frame.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "SIM", "UP", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src/inky_bird_frame", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
