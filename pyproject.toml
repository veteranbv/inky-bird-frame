[project]
name = "inky-bird-frame"
version = "0.9.7"
description = "Discover birds and display reviewed field-journal plates on color e-paper"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Henry Sowell" }]
keywords = [
    "birding",
    "birdnet",
    "ebird",
    "e-paper",
    "inaturalist",
    "raspberry-pi",
    "self-hosted",
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://henrysowell.com/birds"
Documentation = "https://github.com/veteranbv/inky-bird-frame#readme"
Issues = "https://github.com/veteranbv/inky-bird-frame/issues"
Releases = "https://github.com/veteranbv/inky-bird-frame/releases"
Repository = "https://github.com/veteranbv/inky-bird-frame"

[project.optional-dependencies]
controller = [
    "apprise>=1.12.0,<3",
    "argon2-cffi>=25.1.0",
    "authlib>=1.8.0,<2",
    "httpx2>=2.13.1",
    "joserfc>=1.7.5,<2",
    "starlette>=1.8.0",
    "uvicorn>=0.54.0",
]
inky = [
    "inky>=2.4",
]
dev = [
    "apprise>=1.12.0,<3",
    "argon2-cffi>=25.1.0",
    "authlib>=1.8.0,<2",
    "httpx2>=2.13.1",
    "joserfc>=1.7.5,<2",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "starlette>=1.8.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
inky-bird-frame = "inky_bird_frame.entrypoint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"docs/browser-access.md" = "inky_bird_frame/web/access-guide.txt"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "SIM", "UP", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src/inky_bird_frame", "tests"]

[[tool.mypy.overrides]]
# Authlib ships no PEP 561 metadata. oidc.py checks its two imported surfaces
# through typed protocol adapters; keep all application code under strict MyPy.
module = ["authlib.integrations.httpx_client", "authlib.oidc.core"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
