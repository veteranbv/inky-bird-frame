<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fcf9f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#251f18" media="(prefers-color-scheme: dark)">
  <title>Inky Bird Frame</title>
  <link rel="stylesheet" href="/app/app.css">
  <script type="module" src="/app/app.js"></script>
</head>
<body>
  <header>
    <a href="/app">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 3.5c-5 0-9.5 2-12.5 5.5-2.4 2.8-3.5 6.5-3.7 10.8 4.3-.2 8-1.3 10.8-3.7 3.5-3 5.4-7.6 5.4-12.6z"/>

      Inky</a>
    <span>Your bird journal</span>

  <main id="main" aria-busy="true">

    <p id="status" role="status">Checking your connection…</p>

  </main>

</html>
